name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install the Agent Skills reference validator
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Validate the skill, docs, and dist zip
        run: python scripts/validate.py
